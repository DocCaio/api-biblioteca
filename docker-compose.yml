services:
  db:
    image: postgres:18-alpine
    container_name: biblioteca-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: biblioteca_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - biblioteca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d biblioteca_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: biblioteca-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/biblioteca_db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  biblioteca_pgdata: